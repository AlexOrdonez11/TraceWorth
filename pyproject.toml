[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceworth"
version = "0.1.0"
description = "Application-independent workflow telemetry for Python AI applications"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema[format]>=4.18,<5", "httpx>=0.27,<1"]
backend = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traceworth = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[project.scripts]
traceworth = 'traceworth.cli:main'
